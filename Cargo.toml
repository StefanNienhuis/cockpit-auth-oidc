[package]
name = "cockpit-auth-oidc"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
exec = "0.3"
openidconnect = { version = "4", features = ["reqwest-blocking"] }